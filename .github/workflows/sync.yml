name: Sync Promocodes and Schedule

on:
  schedule:
    # Run every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sync and scraping script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python sync_promocodes.py

      - name: Run lint and integrity validation
        run: |
          python lint_data.py --strict

      - name: Notify Telegram on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python notify.py --failure "GitHub Actions sync workflow execution failed on runner. Run ID: $GITHUB_RUN_ID"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add promocodes.json banners_schedule.json game_catalog.json avatars/
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore(data): auto-clean & sync promocodes, banners and catalog [skip ci]"
            git push
          fi
